<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Carreras — Instituto Pío XII</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilo.css">

    <style>
        .page-wrap{ padding: 72px 6vw; max-width:1100px; margin:0 auto; }
        .list-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-top:18px }
        .card{ background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); padding:18px; border-radius:12px; cursor:pointer }
        .card strong{ display:block; margin-bottom:8px; font-family:'Space Grotesk',sans-serif }
        #detalle{ margin-top:26px; background: rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.04); padding:20px; border-radius:12px }
        .back{ display:inline-block; margin-bottom:12px; color:var(--ink-dim); text-decoration:none }
    </style>
</head>
<body>

    <nav id="menu" style="position:static;margin:18px auto;left:0;right:0;width:fit-content;">
        <div class="logo">PÍO XII</div>
        <ul class="links" style="display:inline-flex;gap:14px">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="carreras.html">Carreras</a></li>
            <li><a href="index.html#historia">Historia</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
    </nav>

    <main class="page-wrap">
        <h1>Carreras Técnicas</h1>
        <p>Explora la oferta educativa del Instituto Tecnológico Pío XII. Haz clic en una carrera para ver más detalles.</p>

        <div id="lista" class="list-grid"></div>

        <div id="detalle" hidden>
            <a class="back" href="index.html">← Volver al inicio</a>
            <h2 id="detalle-titulo"></h2>
            <p id="detalle-texto"></p>
        </div>
    </main>

    <script>
        const carreras = [
            {
                id: 'contabilidad',
                titulo: 'CONTABILIDAD GENERAL',
                resumen: 'Gestión y administración financiera',
                detalle: `La Licenciatura en Contabilidad General forma profesionales con capacidad para dirigir y auditar la situación económica y financiera de organizaciones.

Los egresados interpretan datos para la toma de decisiones gerenciales, realizan planificación fiscal estratégica y evalúan riesgos financieros.

Perfil del egresado:
- Dirección de departamentos contables y financieros.
- Auditoría interna y externa, peritaje contable.
- Diseño de políticas tributarias y control de gestión.`
            },
            {
                id: 'informatica',
                titulo: 'SISTEMAS INFORMÁTICOS',
                resumen: 'Desarrollo de software y sistemas',
                detalle: `Esta carrera prepara profesionales capaces de diseñar, implementar y gestionar infraestructuras tecnológicas.

Los egresados lideran proyectos de desarrollo de software, arquitectura de redes empresariales, ciberseguridad e integración de tecnologías emergentes (IA y computación en la nube).

Perfil del egresado:
- Desarrollo y gestión de proyectos de software.
- Arquitectura y administración de sistemas y redes.
- Gestión de seguridad informática.`
            },
            {
                id: 'administracion',
                titulo: 'ADMINISTRACION DE EMPRESAS',
                resumen: 'Dirección y gestión empresarial',
                detalle: `Esta carrera forma líderes con visión integral del mercado y competencias para dirigir organizaciones.

Los profesionales diseñan modelos de negocio, gestionan operaciones, finanzas y recursos humanos, y lideran procesos de transformación organizacional.

Perfil del egresado:
- Gerencia general y dirección estratégica.
- Consultoría y evaluación de proyectos.
- Diseño de estrategias competitivas.`
            },
            {
                id: 'secretariado',
                titulo: 'SECRETARIADO EJECUTIVO',
                resumen: 'Gestión y comunicación institucional',
                detalle: `La Licenciatura en Secretariado Ejecutivo forma profesionales expertos en gestión gerencial, comunicación corporativa y relaciones públicas.

Los egresados actúan como enlace estratégico de la alta dirección, optimizan flujos de información y coordinan eventos institucionales de alto nivel.

Perfil del egresado:
- Gestión administrativa y apoyo directivo.
- Comunicación institucional y relaciones públicas.
- Organización de eventos y protocolos.`
            },
            {
                id: 'gastronomia',
                titulo: 'GASTRONOMIA',
                resumen: 'Ciencias culinarias y gestión gastronómica',
                detalle: `La Licenciatura en Gastronomía combina el arte culinario con ciencias de la alimentación y gestión empresarial.

Los egresados innovan en técnicas culinarias, gestionan emprendimientos gastronómicos y preservan patrimonio alimentario.

Perfil del egresado:
- Dirección y gestión de establecimientos gastronómicos.
- Investigación e innovación culinaria.
- Desarrollo de productos alimentarios.`
            }
        ];

        const lista = document.getElementById('lista');
        const detalle = document.getElementById('detalle');
        const titulo = document.getElementById('detalle-titulo');
        const texto = document.getElementById('detalle-texto');

        function crearCard(c){
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<strong>${c.titulo}</strong><div style="color:var(--ink-dim)">${c.resumen}</div>`;
            el.addEventListener('click', ()=> mostrarDetalle(c));
            return el;
        }

        function mostrarDetalle(c){
            titulo.textContent = c.titulo;
            texto.textContent = c.detalle;
            detalle.hidden = false;
            window.scrollTo({top: detalle.offsetTop - 20, behavior: 'smooth'});
        }

        // Renderizar
        carreras.forEach(c=> lista.appendChild(crearCard(c)));

    </script>

</body>
</html>
