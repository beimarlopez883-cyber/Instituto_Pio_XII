<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Galería — Instituto Pío XII</title>
	<link rel="stylesheet" href="estilo.css">
	<style>
		.gallery-page{ max-width:1240px; margin:0 auto; padding:132px 6vw 72px; }
		.gallery-intro{ max-width:720px; margin-bottom:34px; }
		.gallery-kicker{ color:var(--accent-a); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
		.gallery-intro h1{ color:var(--accent-b); font-family:var(--font-display); font-size:clamp(34px,5vw,60px); line-height:1.02; margin-bottom:16px; }
		.gallery-intro p{ color:var(--ink-dim); font-size:16px; line-height:1.7; }
		.gallery-meta{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; color:var(--ink-dim); font-size:13px; }
		.gallery-meta strong{ color:var(--accent-b); font-family:var(--font-display); font-size:18px; }
		.grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:18px; }
		.thumb{ position:relative; grid-column:span 4; overflow:hidden; min-height:250px; border:1px solid var(--glass-border); border-radius:var(--radius); cursor:pointer; background:rgba(5,7,13,.65); box-shadow:0 16px 36px rgba(0,0,0,.28); }
		.thumb:nth-child(1), .thumb:nth-child(4){ grid-column:span 6; }
		.thumb img{ width:100%; height:100%; min-height:250px; object-fit:cover; display:block; transition:transform .45s ease, filter .45s ease; }
		.thumb::after{ content:""; position:absolute; inset:35% 0 0; background:linear-gradient(transparent,rgba(4,8,18,.9)); pointer-events:none; }
		.thumb:hover img, .thumb:focus-visible img{ transform:scale(1.05); filter:saturate(1.12); }
		.thumb:focus-visible{ outline:2px solid var(--accent-b); outline-offset:4px; }
		.caption{ position:absolute; left:20px; right:20px; bottom:18px; z-index:1; color:#fff; font-family:var(--font-display); font-size:18px; font-weight:600; }
		.caption small{ display:block; margin-top:4px; color:#cfe3f8; font-family:var(--font-body); font-size:12px; font-weight:400; }

		/* Modal */
		.modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:32px; background:rgba(3,7,15,.9); backdrop-filter:blur(12px); z-index:200 }
		.modal img{ max-width:min(1100px,92vw); max-height:82vh; border:1px solid var(--glass-border); border-radius:12px; box-shadow:0 24px 70px rgba(0,0,0,.55) }
		.modal.show{ display:flex }
		.modal .close{ position:absolute; top:24px; right:28px; width:42px; height:42px; border:1px solid var(--glass-border); border-radius:50%; background:rgba(255,255,255,.1); color:#fff; font-size:20px; cursor:pointer }
		.modal .close:hover, .modal .close:focus-visible{ background:var(--accent-b); color:#06110d; outline:none }
		@media (max-width:760px){ .gallery-page{ padding:124px 18px 48px; } .grid{ grid-template-columns:1fr; gap:14px; } .thumb, .thumb:nth-child(1), .thumb:nth-child(4){ grid-column:span 1; min-height:220px; } .thumb img{ min-height:220px; } .gallery-meta{ align-items:flex-start; flex-direction:column; } .modal{ padding:18px; } }
	</style>
</head>
<body>

	<nav id="menu">
		<a class="logo" href="index.html" aria-label="Instituto Tecnológico Pío XII">
			<img src="logo.jpg" alt="Logo del Instituto Tecnológico Pío XII">
			<span>INSTITUTO TECNOLÓGICO <strong>PÍO XII</strong></span>
		</a>
		<ul class="links">
			<li><a href="index.html">Inicio</a></li>
			<li><a href="galeria.html">Galería</a></li>
			<li><a href="carreras.html">Carreras</a></li>
			<li><a href="index.html#historia">Historia</a></li>
			<li><a href="index.html#contacto">Contacto</a></li>
		</ul>
	</nav>

	<main class="gallery-page">
		<header class="gallery-intro">
			<div class="gallery-kicker">Instituto Técnico Pío XII</div>
			<h1>Una mirada a nuestro espacio de formación.</h1>
			<p>Recorre algunos de los espacios y modelos que representan la identidad técnica del instituto.</p>
		</header>

		<div class="gallery-meta">
			<strong>Campus y modelos</strong>
			<span id="imageCount"></span>
		</div>

		<div id="grid" class="grid"></div>

		<div id="modal" class="modal" role="dialog" aria-hidden="true">
			<button class="close" id="close" type="button" aria-label="Cerrar imagen">&times;</button>
			<img id="modalImg" src="" alt="">
		</div>
	</main>

	<script>
		// Lista de imágenes incluidas en el proyecto (generada desde los archivos disponibles)
		const images = [
			{ src: 'modelos/pio.jpg', title: 'Vista del instituto', detail: 'Arquitectura y entorno' },
			{ src: 'modelos/pio3.jpg', title: 'Espacios de aprendizaje', detail: 'Diseño del campus' },
			{ src: 'modelos/pio4.jpg', title: 'Detalle del modelo', detail: 'Volumen y estructura' },
			{ src: 'modelos/pio5.jpg', title: 'Propuesta arquitectónica', detail: 'Identidad visual Pío XII' }
		];

		const grid = document.getElementById('grid');
		const modal = document.getElementById('modal');
		const modalImg = document.getElementById('modalImg');
		const closeBtn = document.getElementById('close');
		const imageCount = document.getElementById('imageCount');
		imageCount.textContent = `${images.length} imágenes seleccionadas`;

		images.forEach((image) => {
			const div = document.createElement('div');
			div.className = 'thumb';
			div.tabIndex = 0;
			const img = document.createElement('img');
			img.src = image.src;
			img.alt = image.title;
			const cap = document.createElement('div');
			cap.className = 'caption';
			cap.innerHTML = `${image.title}<small>${image.detail}</small>`;
			div.appendChild(img);
			div.appendChild(cap);
			const openImage = () => {
				modalImg.src = image.src;
				modalImg.alt = image.title;
				modal.classList.add('show');
				modal.setAttribute('aria-hidden','false');
			};
			div.addEventListener('click', openImage);
			div.addEventListener('keydown', (event) => {
				if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openImage(); }
			});
			grid.appendChild(div);
		});

		closeBtn.addEventListener('click', ()=>{
			modal.classList.remove('show');
			modal.setAttribute('aria-hidden','true');
		});

		modal.addEventListener('click', (e)=>{
			if (e.target === modal) {
				modal.classList.remove('show');
				modal.setAttribute('aria-hidden','true');
			}
		});

		document.addEventListener('keydown', (event) => {
			if (event.key === 'Escape') closeBtn.click();
		});
	</script>

</body>
</html>
