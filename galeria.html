<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Galería — Instituto Pío XII</title>
	<link rel="stylesheet" href="estilo.css">
	<style>
		.page{ padding:72px 6vw; max-width:1200px; margin:0 auto; }
		.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
		.thumb{ position:relative; overflow:hidden; border-radius:10px; cursor:pointer }
		.thumb img{ width:100%; height:160px; object-fit:cover; display:block; transition:transform .35s ease }
		.thumb:hover img{ transform:scale(1.06) }
		.caption{ position:absolute; left:10px; bottom:10px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.6); font-weight:600 }

		/* Modal */
		.modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:200 }
		.modal img{ max-width:92%; max-height:86%; border-radius:8px }
		.modal.show{ display:flex }
		.modal .close{ position:absolute; top:18px; right:20px; color:#fff; font-size:24px; cursor:pointer }
		.toolbar{ display:flex; gap:12px; margin-top:10px; justify-content:center }
		.toolbar button{ background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); color:var(--ink); padding:8px 12px; border-radius:8px }
	</style>
</head>
<body>

	<nav id="menu">
		<div class="logo">PÍO XII</div>
		<ul class="links">
			<li><a href="index.html">Inicio</a></li>
			<li><a href="galeria.html">Galería</a></li>
			<li><a href="carreras.html">Carreras</a></li>
			<li><a href="index.html#historia">Historia</a></li>
			<li><a href="index.html#contacto">Contacto</a></li>
		</ul>
	</nav>

	<main class="page">
		<h1>Galería del Instituto</h1>
		<p>Imágenes del campus, laboratorios y actividades. Agrega imágenes en la carpeta <strong>galeria/</strong> o en <strong>modelos/</strong> para que aparezcan automáticamente si editas el array abajo.</p>

		<div id="grid" class="grid"></div>

		<div id="modal" class="modal" role="dialog" aria-hidden="true">
			<div class="close" id="close">✕</div>
			<img id="modalImg" src="" alt="">
		</div>
	</main>

	<script>
		// Lista de imágenes incluidas en el proyecto (generada desde los archivos disponibles)
		const images = [
			'modelos/pio.jpg',
			'modelos/pio3.jpg',
			'modelos/poio2.jpg',
			'modelos/pio4.jpg',
			'modelos/pio5.jpg',
			'modelos/silla-universitaria-brazo-abatible-plastico.jpg'
		];

		const grid = document.getElementById('grid');
		const modal = document.getElementById('modal');
		const modalImg = document.getElementById('modalImg');
		const closeBtn = document.getElementById('close');

		images.forEach((src, i) => {
			const div = document.createElement('div');
			div.className = 'thumb';
			const img = document.createElement('img');
			img.src = src;
			img.alt = 'Imagen ' + (i+1);
			const cap = document.createElement('div');
			cap.className = 'caption';
			cap.textContent = 'Imagen ' + (i+1);
			div.appendChild(img);
			div.appendChild(cap);
			div.addEventListener('click', ()=>{
				modalImg.src = src;
				modal.classList.add('show');
				modal.setAttribute('aria-hidden','false');
			});
			grid.appendChild(div);
		});

		closeBtn.addEventListener('click', ()=>{
			modal.classList.remove('show');
			modal.setAttribute('aria-hidden','true');
		});

		modal.addEventListener('click', (e)=>{
			if (e.target === modal) {
				modal.classList.remove('show');
				modal.setAttribute('aria-hidden','true');
			}
		});
	</script>

</body>
</html>
